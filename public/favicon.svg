<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">tirhal — Phoenician boat inside an Islamic twelve-fold rosette</title>

  <!-- White rounded chip so the mark reads on any tab theme. -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="#ffffff"/>

  <defs>
    <path id="band" d="M -210 0 L -140 -90 L 140 -90 L 210 0 L 140 90 L -140 90 Z"/>
  </defs>

  <!-- Islamic rosette · primary terracotta -->
  <g transform="translate(256 256)" fill="none" stroke-width="10"
     stroke="#c75b39">
    <use href="#band"/>
    <use href="#band" transform="rotate(30)"/>
    <use href="#band" transform="rotate(60)"/>
    <use href="#band" transform="rotate(90)"/>
    <use href="#band" transform="rotate(120)"/>
    <use href="#band" transform="rotate(150)"/>
  </g>

  <!-- Phoenician boat · secondary wood-brown lines, accent sail -->
  <g transform="translate(256 256)" fill="none" stroke-width="10"
     stroke="#8b5a2b"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- hull -->
    <path d="M -58 4 Q 0 64 58 4 Q 0 28 -58 4 Z"/>
    <!-- stern hook -->
    <path d="M -58 4 Q -68 -6 -63 -18"/>
    <!-- prow with horse-head hint -->
    <path d="M 58 4 Q 70 -8 65 -19 Q 63 -26 55 -26"/>
    <!-- mast -->
    <path d="M 0 16 L 0 -22"/>
    <!-- square sail -->
    <path d="M -32 -52 Q 0 -62 32 -52 L 24 -16 Q 0 -26 -24 -16 Z"
          fill="#e89b3e"/>
  </g>
</svg>
